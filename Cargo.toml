[package]
name = "visor"
version = "0.1.0"
edition = "2024"

[lib]
name = "visor"
path = "src/lib.rs"

[[bin]]
name = "visor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
humantime-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
tray-icon = "0.19"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_FaceAnalysis",
    "Media_MediaProperties",
    "Graphics_Imaging",
    "Foundation",
    "Foundation_Collections",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
