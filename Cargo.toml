[package]
name = "visor"
version = "0.1.0"
edition = "2024"

[lib]
name = "visor"
path = "src/lib.rs"

[[bin]]
name = "visor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
humantime-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
tray-icon = "0.19"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_System_Power",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_FaceAnalysis",
    "Graphics_Imaging",
    "Foundation_Collections",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
# Deliberately NOT `panic = "abort"`. Unwinding is what lets VISOR put the
# screen back: `main` catches a panic in the message pump, and a panic on the
# engine thread has to unwind for `join` to return an error rather than taking
# the process down where it stands. With `abort` every one of those restore
# paths is dead code in the shipped binary, and a panic while the panel is off
# over DDC leaves it off after the process is gone -- the one outcome this
# program exists to prevent. The size it costs is worth less than that.
